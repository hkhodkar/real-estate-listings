name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build --base-href /real-estate-listings/

      # GitHub Pages has no SPA fallback, so serve the app for unknown routes too
      - run: cp dist/real-estate-listings/browser/index.html dist/real-estate-listings/browser/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/real-estate-listings/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
